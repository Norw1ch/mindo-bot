<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Мои планы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ?v=N меняется при каждом обновлении, чтобы Telegram не показывал старую версию -->
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <main id="app"><p class="empty">Загрузка…</p></main>
  <div id="toast" class="toast"></div>

  <!-- Окно ввода текста -->
  <div id="sheet" class="sheet">
    <div class="sheet-box">
      <p id="sheet-title" class="sheet-title"></p>
      <div id="sheet-fields" class="sheet-fields"></div>
      <div class="sheet-actions">
        <button class="btn quiet" id="sheet-cancel">Отмена</button>
        <button class="btn primary" id="sheet-save">Сохранить</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=12"></script>
</body>
</html>
