<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Мои задачи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ?v=N меняется при каждом обновлении, чтобы Telegram не показывал старую версию -->
  <link rel="stylesheet" href="style.css?v=50">
</head>
<body>
  <main id="app"><p class="empty" data-t="Загрузка…">Загрузка…</p></main>
  <nav id="tabbar" class="tabbar"></nav>
  <!-- «Готово» — появляется, пока правишь текст на экране -->
  <button id="done-btn" class="done-btn" data-t="Готово">Готово</button>
  <div id="toast" class="toast"></div>

  <!-- Окно ввода текста -->
  <div id="sheet" class="sheet">
    <div class="sheet-box">
      <p id="sheet-title" class="sheet-title"></p>
      <div id="sheet-fields" class="sheet-fields"></div>
      <div class="sheet-actions">
        <button class="btn quiet" id="sheet-cancel" data-t="Отмена">Отмена</button>
        <button class="btn primary" id="sheet-save" data-t="Сохранить">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Календарь выбора даты -->
  <div id="date-shade" class="date-shade"></div>
  <div id="date-pop" class="cal date-pop"></div>

  <!-- Меню выбора снизу -->
  <div id="choice" class="choice">
    <div class="choice-box">
      <div class="choice-list">
        <p id="choice-title" class="choice-title"></p>
        <div id="choice-opts"></div>
      </div>
      <button class="choice-cancel" id="choice-cancel" data-t="Отмена">Отмена</button>
    </div>
  </div>

  <!-- Порядок важен: основа → общий интерфейс → модули → запуск -->
  <script src="js/core.js?v=50"></script>
  <script src="js/lang.js?v=50"></script>
  <script src="js/ui.js?v=50"></script>
  <script src="js/plans.js?v=50"></script>
  <script src="js/notes.js?v=50"></script>
  <script src="js/lists.js?v=50"></script>
  <script src="js/habits.js?v=50"></script>
  <script src="js/money.js?v=50"></script>
  <script src="js/backup.js?v=50"></script>
  <script src="js/settings.js?v=50"></script>
  <script src="js/home.js?v=50"></script>
  <script src="js/main.js?v=50"></script>
</body>
</html>
